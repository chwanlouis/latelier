name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_LATELIER }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Add EC2 to known hosts
      run: |
        ssh-keyscan -H 13.239.19.185 >> ~/.ssh/known_hosts

    # 1. 在 Runner 上將專案檔案打包，輸出至 /tmp 避免自我讀寫衝突
    - name: Package application
      run: |
        tar -czf /tmp/deploy.tar.gz --exclude='.git' --exclude='.github' .

    # 2. 使用 scp 將 /tmp 中的壓縮檔傳送到 EC2 的家目錄
    - name: Copy package to EC2
      run: |
        scp -i ~/.ssh/id_rsa /tmp/deploy.tar.gz ec2-user@13.239.19.185:/home/ec2-user/

    # 3. 連線至 EC2 安裝元件、解壓縮並執行 Docker Compose
    - name: Deploy and Start Containers
      run: |
        ssh -i ~/.ssh/id_rsa ec2-user@13.239.19.185 << 'EOF'
        # A. 確保 Docker 已安裝 (Amazon Linux 2023 專用)
        if ! command -v docker &> /dev/null; then
            echo "未偵測到 Docker，正在進行安裝..."
            sudo dnf install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            # 將 ec2-user 加入 docker 群組以獲得執行權限
            sudo usermod -aG docker ec2-user
        fi

        # B. 確保安裝了 Docker Compose 外掛程式
        if ! docker compose version &> /dev/null; then
            echo "未偵測到 Docker Compose，正在下載安裝..."
            # 建立目前用戶的外掛程式目錄
            mkdir -p ~/.docker/cli-plugins/
            # 下載最新穩定版 Docker Compose V2 二進位檔案
            curl -SL https://github.com -o ~/.docker/cli-plugins/docker-compose
            # 賦予可執行權限
            chmod +x ~/.docker/cli-plugins/docker-compose
        fi

        # C. 定義專案目標目錄（請根據您的實際專案名稱修改 latelier）
        TARGET_DIR="/home/ec2-user/latelier"
        mkdir -p "$TARGET_DIR"

        # D. 將壓縮檔解壓到目標目錄，並刪除暫存的壓縮檔
        tar -xzf /home/ec2-user/deploy.tar.gz -C "$TARGET_DIR"
        rm -f /home/ec2-user/deploy.tar.gz

        # E. 切換到專案目錄並啟動 Docker Compose
        cd "$TARGET_DIR"
        
        echo "正在啟動 Docker 容器..."
        # 由於 Docker Compose 安裝在用戶目錄，這裡直接以 ec2-user 權限執行，不加 sudo
        docker compose up -d --build

        echo "部署成功！"
        EOF
