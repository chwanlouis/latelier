name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Package application
      run: |
        tar -czf /tmp/deploy.tar.gz --exclude='.git' --exclude='.github' .

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_LATELIER }}
        known_hosts: 'unnecessary'

    - name: Add EC2 to known hosts
      run: |
        ssh-keyscan -H 13.236.147.145 >> ~/.ssh/known_hosts

    - name: Copy package to EC2
      run: |
        scp /tmp/deploy.tar.gz ec2-user@13.236.147.145:/home/ec2-user/

    - name: Setup Docker Engine on EC2
      run: |
        ssh ec2-user@13.236.147.145 << 'EOF'
        set -e
        if ! command -v docker &> /dev/null; then
            echo "Installing Docker base engine..."
            sudo dnf update -y
            sudo dnf install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ec2-user
            echo "Docker installed successfully."
        else
            echo "Docker is already installed."
        fi
        EOF

    - name: Setup Docker Compose Plugin on EC2
      run: |
          ssh ec2-user@13.236.147.145 << 'EOF'
          set -e
          if ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose binary plugin..."
              sudo mkdir -p /usr/libexec/docker/cli-plugins/
          
              ARCH=$(uname -m)
              sudo curl -SL "https://github.com{ARCH}" -o /usr/libexec/docker/cli-plugins/docker-compose
          
              sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
              echo "Docker Compose installed successfully."
          else
              echo "Docker Compose is already installed."
          fi
          EOF

    - name: Inject Production .env File on EC2
      run: |
        ssh ec2-user@13.236.147.145 << 'EOF'
        TARGET_DIR="/home/ec2-user/latelier"
        mkdir -p "$TARGET_DIR"
        
        cat << 'INNER_EOF' > "$TARGET_DIR/.env"
        ENV=production
        SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
        ALGORITHM=HS256
        ACCESS_TOKEN_EXPIRE_MINUTES=60
        REFRESH_TOKEN_EXPIRE_DAYS=7
        DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}

        BACKEND_PORT=${{ secrets.BACKEND_PORT }}
        FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}

        POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
        POSTGRES_DB=${{ secrets.POSTGRES_DB }}
        POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
        POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

        NEO4J_HOST=${{ secrets.NEO4J_HOST }}
        NEO4J_PORT=${{ secrets.NEO4J_PORT }}
        NEO4J_USERNAME=${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}

        INIT_ADMIN_USERNAME=${{ secrets.INIT_ADMIN_USERNAME }}
        INIT_ADMIN_PASSWORD=${{ secrets.INIT_ADMIN_PASSWORD }}
        INIT_ADMIN_EMAIL=${{ secrets.INIT_ADMIN_EMAIL }}
        INNER_EOF
        
        chmod 600 "$TARGET_DIR/.env"
        echo "Production .env file with all 15 matrix keys synchronized successfully."
        EOF

    - name: Extract Package and Start Containers
      run: |
        ssh ec2-user@13.236.147.145 << 'EOF'
        set -e
        TARGET_DIR="/home/ec2-user/latelier"
        
        tar -xzf /home/ec2-user/deploy.tar.gz -C "$TARGET_DIR"
        rm -f /home/ec2-user/deploy.tar.gz
        
        cd "$TARGET_DIR"
        
        echo "Launching production microservices via Docker Compose..."
        
        docker compose down || true
        docker compose down postgres -v
        docker compose up -d --build
        
        echo "Deployment completed successfully!"
        EOF
