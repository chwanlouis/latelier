name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Package application
      run: |
        tar -czf /tmp/deploy.tar.gz --exclude='.git' --exclude='.github' .

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.EC2_LATELIER }}
        known_hosts: 'unnecessary'

    - name: Add EC2 to known hosts
      run: |
        ssh-keyscan -H 13.239.19.185 >> ~/.ssh/known_hosts

    - name: Copy package to EC2
      run: |
        scp /tmp/deploy.tar.gz ec2-user@13.239.19.185:/home/ec2-user/

    # Step 1: Ensure Core Docker Engine is Installed
    - name: Setup Docker Engine on EC2
      run: |
        ssh ec2-user@13.239.19.185 << 'EOF'
        set -e
        if ! command -v docker &> /dev/null; then
            echo "Installing Docker base engine..."
            sudo dnf update -y
            sudo dnf install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker ec2-user
            echo "Docker installed successfully."
        else
            echo "Docker is already installed."
        fi
        EOF

    # Step 2: Ensure Docker Compose Plugin is Installed
    - name: Setup Docker Compose Plugin on EC2
      run: |
        ssh ec2-user@13.239.19.185 << 'EOF'
        set -e
        if ! docker compose version &> /dev/null; then
            echo "Installing Docker Compose binary plugin..."
            sudo mkdir -p /usr/libexec/docker/cli-plugins/
            sudo curl -SL "https://github.com(uname -m)" -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            echo "Docker Compose installed successfully."
        else
            echo "Docker Compose is already installed."
        fi
        EOF

    # Step 3: Extract Package and Launch Application
    - name: Extract Package and Start Containers
      run: |
        ssh ec2-user@13.239.19.185 << 'EOF'
        set -e
        TARGET_DIR="/home/ec2-user/latelier"
        mkdir -p "$TARGET_DIR"

        # Extract code updates
        tar -xzf /home/ec2-user/deploy.tar.gz -C "$TARGET_DIR"
        rm -f /home/ec2-user/deploy.tar.gz

        cd "$TARGET_DIR"
        
        echo "Launching production microservices via Docker Compose..."
        sudo docker compose down --remove-orphans || true
        sudo docker compose up -d --build

        echo "Deployment completed successfully!"
        EOF
