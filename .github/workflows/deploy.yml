name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_LATELIER }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Add EC2 to known hosts
      run: |
        ssh-keyscan -H 13.239.19.185 >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      run: |
        ssh -i ~/.ssh/id_rsa ec2-user@13.239.19.185 << 'EOF'
        # 1. 確保 EC2 已安裝 Git 與 Docker (Amazon Linux 2023 專用指令)
        if ! command -v git &> /dev/null; then
            echo "安裝 Git..."
            sudo dnf install -y git
        fi

        if ! command -v docker &> /dev/null; then
            echo "安裝 Docker..."
            sudo dnf install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
            # 將目前用戶加入 docker 群組，免去每次都要輸入 sudo
            sudo usermod -aG docker ec2-user
        fi

        # 2. 定義 EC2 專案路徑（請根據您的實際專案名稱修改 latelier）
        TARGET_DIR="/home/ec2-user/latelier"

        # 3. 同步程式碼
        if [ ! -d "$TARGET_DIR" ]; then
            echo "專案目錄不存在，進行首次 Clone..."
            # 請替換為您的 Git 倉庫網址
            git clone https://github.com "$TARGET_DIR"
            cd "$TARGET_DIR"
        else
            echo "專案目錄已存在，更新程式碼..."
            cd "$TARGET_DIR"
            git pull origin main
        fi

        # 4. 執行 Docker Compose 部署
        echo "正在啟動 Docker 容器..."
        # --build 確保程式碼更新後會重新建立 Image，-d 讓容器在背景執行
        sudo docker compose up -d --build

        echo "部署完成！"
        EOF
