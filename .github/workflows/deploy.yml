name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_LATELIER }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Add EC2 to known hosts
      run: |
        ssh-keyscan -H 13.239.19.185 >> ~/.ssh/known_hosts

    # 1. 在 Runner 上將專案檔案打包成一個壓縮檔（排除不必要的 git 歷史紀錄）
    - name: Package application
      run: |
        tar -czf deploy.tar.gz --exclude='.git' --exclude='.github' .

    # 2. 使用 scp 將壓縮檔傳送到 EC2 的家目錄
    - name: Copy package to EC2
      run: |
        scp -i ~/.ssh/id_rsa deploy.tar.gz ec2-user@13.239.19.185:/home/ec2-user/

    # 3. 連線至 EC2 解壓縮並執行 Docker Compose
    - name: Deploy and Start Containers
      run: |
        ssh -i ~/.ssh/id_rsa ec2-user@13.239.19.185 << 'EOF'
        # 確保 Docker 已安裝
        if ! command -v docker &> /dev/null; then
            echo "安裝 Docker..."
            sudo dnf install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
        fi

        # 定義專案目標目錄
        TARGET_DIR="/home/ec2-user/latelier"
        mkdir -p "$TARGET_DIR"

        # 將壓縮檔解壓到目標目錄，並刪除暫存的壓縮檔
        tar -xzf /home/ec2-user/deploy.tar.gz -C "$TARGET_DIR"
        rm -f /home/ec2-user/deploy.tar.gz

        # 切換到專案目錄並啟動 Docker Compose
        cd "$TARGET_DIR"
        sudo docker compose up -d --build

        echo "部署成功！"
        EOF
