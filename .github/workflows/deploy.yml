name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_LATELIER }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Add EC2 to known hosts
      run: |
        ssh-keyscan -H 13.239.19.185 >> ~/.ssh/known_hosts

    # 1. 在 Runner 上將專案檔案打包，輸出至 /tmp 避免自我讀寫衝突
    - name: Package application
      run: |
        tar -czf /tmp/deploy.tar.gz --exclude='.git' --exclude='.github' .

    # 2. 使用 scp 將壓縮檔傳送到 EC2 的家目錄
    - name: Copy package to EC2
      run: |
        scp -i ~/.ssh/id_rsa /tmp/deploy.tar.gz ec2-user@13.239.19.185:/home/ec2-user/

    # 3. 連線至 EC2 安裝元件、解壓縮並執行 Docker Compose
    - name: Deploy and Start Containers
      run: |
        ssh -i ~/.ssh/id_rsa ec2-user@13.239.19.185 << 'EOF'
        # A. 確保基礎 Docker 引擎已安裝
        if ! command -v docker &> /dev/null; then
            echo "未偵測到 Docker，正在進行安裝..."
            sudo dnf install -y docker
            sudo systemctl start docker
            sudo systemctl enable docker
        fi

        # B. 修正：手動下載 Docker Compose 並放置在官方全域外掛程式目錄
        if ! docker compose version &> /dev/null; then
            echo "未偵測到 Docker Compose，正在手動配置全域外掛程式..."
            # 建立全域 Docker CLI 外掛程式目錄
            sudo mkdir -p /usr/libexec/docker/cli-plugins/
            # 下載 Docker 官方最新穩定版（自動判斷系統架構如 x86_64 或 aarch64）
            sudo curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o /usr/libexec/docker/cli-plugins/docker-compose
            # 賦予全域可執行權限
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
        fi

        # C. 定義專案目標目錄
        TARGET_DIR="/home/ec2-user/latelier"
        mkdir -p "$TARGET_DIR"

        # D. 將壓縮檔解壓到目標目錄，並刪除暫存的壓縮檔
        tar -xzf /home/ec2-user/deploy.tar.gz -C "$TARGET_DIR"
        rm -f /home/ec2-user/deploy.tar.gz

        # E. 切換到專案目錄
        cd "$TARGET_DIR"
        
        echo "正在啟動 Docker 容器..."
        # 💡 使用 sudo 強制執行，且全域外掛能確保 sudo docker compose 完美運行
        sudo docker compose up -d --build

        echo "部署成功！"
        EOF
